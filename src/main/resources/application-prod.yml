spring:
  datasource:
    url: jdbc:mysql://<RDS-ENDPOINT>:3306/paydeuk
    username: <rds-username>
    password: <rds-password>
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
